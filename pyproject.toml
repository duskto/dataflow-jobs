[project]
name = "dataflow-jobs"
version = "0.1.0"
description = "Reliable CSV processing jobs with fenced workers and a transactional outbox"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6", "python-multipart>=0.0.20,<1", "jinja2>=3.1.5,<4",
]
[dependency-groups]
browser = [
    "playwright>=1.50,<2",
]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "pytest-cov>=6,<8"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
